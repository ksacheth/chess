<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Review</title>
<style>
/* ===== TOKENS — every value here gets replaced by harvest data ===== */
:root{
  --bg:#312e2b; --panel:#262421; --panel-2:#211f1c; --line:#3c3936;
  --text:#e8e6e3; --text-2:#a19f9c; --text-3:#7a7875;
  --light:#ebecd0; --dark:#779556; --hl:rgba(255,255,51,.5);
  --best:#81b64c; --excellent:#96bc4b; --good:#96af8b; --book:#a88865;
  --inaccuracy:#f7c631; --mistake:#ffa459; --blunder:#fa412d; --miss:#ee6b55;
  --brilliant:#26c2a3; --great:#749bbf;
  --font:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fs-sm:12px; --fs:14px; --fs-lg:18px; --fs-xl:32px;
  --radius:6px; --radius-sm:3px; --gap:8px; --pad:12px;
  --shadow:0 2px 6px rgba(0,0,0,.35);
  --sq:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.4 var(--font);min-height:100vh}
.app{display:flex;gap:16px;padding:16px;max-width:1240px;margin:0 auto}
/* ---- board ---- */
.board-col{display:flex;gap:var(--gap);align-items:flex-start}
.evalbar{width:24px;height:calc(var(--sq)*8);background:#403d39;border-radius:var(--radius-sm);position:relative;overflow:hidden}
.evalbar .w{position:absolute;bottom:0;left:0;right:0;background:#fff;transition:height .3s}
.evalbar .n{position:absolute;left:0;right:0;text-align:center;font-size:10px;font-weight:700}
.evalbar .n.top{top:3px;color:#fff}.evalbar .n.bot{bottom:3px;color:#403d39}
.board{display:grid;grid-template-columns:repeat(8,var(--sq));grid-template-rows:repeat(8,var(--sq));border-radius:var(--radius-sm);overflow:hidden;position:relative;box-shadow:var(--shadow)}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--sq)*.78);line-height:1;user-select:none}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.from,.sq.to{box-shadow:inset 0 0 0 var(--sq) var(--hl)}
.sq .p{position:relative;z-index:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.sq .p.w{color:#fff;-webkit-text-stroke:1px #333}.sq .p.b{color:#222}
.sq .badge{position:absolute;top:-6px;right:-6px;z-index:2;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.coord{position:absolute;font-size:11px;font-weight:700;opacity:.8}
.coord.f{bottom:2px;right:3px}.coord.r{top:2px;left:3px}
.sq.l .coord{color:var(--dark)}.sq.d .coord{color:var(--light)}
.arrows{position:absolute;inset:0;pointer-events:none;z-index:3}
.board-controls{display:flex;gap:var(--gap);margin-top:var(--gap)}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 12px;font:inherit;cursor:pointer}
button:hover{background:var(--line)}
button:focus-visible{outline:2px solid var(--best);outline-offset:1px}
/* ---- review panel ---- */
.panel{flex:1;min-width:320px;max-width:420px;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;max-height:calc(var(--sq)*8 + 42px)}
.panel-h{padding:var(--pad);font-size:var(--fs-lg);font-weight:700;border-bottom:1px solid var(--line)}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);padding:var(--pad);background:var(--panel-2)}
.acc .side{text-align:center}
.acc .name{font-size:var(--fs-sm);color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .num{font-size:var(--fs-xl);font-weight:800;padding:6px 0;border-radius:var(--radius-sm)}
.acc .side.w .num{background:#fff;color:#312e2b}.acc .side.b .num{background:#262421;color:#fff;border:1px solid var(--line)}
.counts{padding:var(--pad);display:grid;grid-template-columns:36px 1fr 36px;row-gap:4px;align-items:center;border-bottom:1px solid var(--line)}
.counts .c{text-align:center;font-weight:700}
.counts .lbl{display:flex;align-items:center;gap:6px;justify-content:center;color:var(--text-2)}
.ico{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.moves{flex:1;overflow:auto;padding:4px 0}
.mv-row{display:grid;grid-template-columns:38px 1fr 1fr;align-items:stretch}
.mv-row:nth-child(odd){background:var(--panel-2)}
.mv-row .num{color:var(--text-3);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:var(--fs-sm)}
.mv{display:flex;align-items:center;gap:6px;padding:5px 8px;cursor:pointer;border-radius:var(--radius-sm);font-weight:600}
.mv:hover{background:var(--line)}
.mv.sel{background:var(--text);color:var(--bg)}
.mv .ico{width:16px;height:16px;font-size:9px}
.comment{padding:var(--pad);border-top:1px solid var(--line);background:var(--panel-2);min-height:64px;font-size:var(--fs)}
.comment b{font-weight:700}
.empty{padding:40px var(--pad);text-align:center;color:var(--text-2)}
input[type=file]{margin-top:12px}
@media (max-width:900px){
  :root{--sq:min(11.5vw,44px)}
  .app{flex-direction:column;padding:8px}
  .panel{max-width:none;max-height:none}
}
@media (prefers-reduced-motion:reduce){.evalbar .w{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div>
    <div class="board-col">
      <div class="evalbar" id="evalbar"><div class="n top" id="evtop"></div><div class="w" id="evw" style="height:50%"></div><div class="n bot" id="evbot"></div></div>
      <div class="board" id="board"><svg class="arrows" id="arrows" viewBox="0 0 8 8"></svg></div>
    </div>
    <div class="board-controls">
      <button id="first" aria-label="First move">|&lt;</button>
      <button id="prev" aria-label="Previous move">&lt;</button>
      <button id="next" aria-label="Next move">&gt;</button>
      <button id="last" aria-label="Last move">&gt;|</button>
      <button id="flip">Flip</button>
    </div>
  </div>
  <div class="panel" id="panel">
    <div class="panel-h">Game Review</div>
    <div class="empty" id="empty">Drop <b>out.json</b> here or choose it<br><input type="file" id="file" accept=".json"></div>
    <div id="review" hidden>
      <div class="acc" id="acc"></div>
      <div class="counts" id="counts"></div>
    </div>
    <div class="moves" id="moves" hidden></div>
    <div class="comment" id="comment" hidden></div>
  </div>
</div>
<script>
const CLS = {
  Brilliant:{s:"!!",v:"--brilliant"}, Great:{s:"!",v:"--great"}, Best:{s:"★",v:"--best"},
  Excellent:{s:"✓",v:"--excellent"}, Good:{s:"✓",v:"--good"}, Book:{s:"📖",v:"--book"},
  Forced:{s:"=",v:"--text-3"}, Inaccuracy:{s:"?!",v:"--inaccuracy"}, Mistake:{s:"?",v:"--mistake"}, Miss:{s:"✗",v:"--miss"}, Blunder:{s:"??",v:"--blunder"}
};
const ORDER = ["Brilliant","Great","Best","Excellent","Good","Book","Forced","Inaccuracy","Mistake","Miss","Blunder"];
const GLYPH = {K:"♚",Q:"♛",R:"♜",B:"♝",N:"♞",P:"♟"};
let data=null, ply=0, flipped=false;
const $ = id=>document.getElementById(id);

function ico(cls, small){ const c=CLS[cls]; return `<span class="ico" style="background:var(${c.v})">${c.s}</span>`; }

function fenBoard(fen){ const rows=fen.split(" ")[0].split("/"); const g=[];
  for(const r of rows){ const row=[]; for(const ch of r){ if(/\d/.test(ch)) row.push(...Array(+ch).fill(null)); else row.push(ch);} g.push(row);} return g; }

function sq(file,rank){ return "abcdefgh"[file]+(rank+1); }

function render(){
  const moves=data.moves, cur=ply>0?moves[ply-1]:null;
  const fen = ply>=moves.length ? moves[moves.length-1].fen_after : moves[ply].fen;
  const g=fenBoard(fen), bd=$("board"); bd.querySelectorAll(".sq").forEach(e=>e.remove());
  const before = cur? fenBoard(cur.fen):null;
  let from=null,to=null;
  if(cur){ const emptied=[],filled=[];
    for(let r=0;r<8;r++)for(let f=0;f<8;f++){ if(before[r][f]!==g[r][f]){ if(g[r][f]===null) emptied.push([r,f]); else filled.push([r,f]); } }
    // castling: two filled squares; pick the king. en passant: two emptied; pick the pawn that moved.
    to = filled.find(([r,f])=>"kK".includes(g[r][f])) || filled[0] || null;
    if(to){ const piece=g[to[0]][to[1]]; from = emptied.find(([r,f])=>before[r][f]===piece) || emptied.find(([r,f])=>before[r][f]&&before[r][f].toLowerCase()==="p") || emptied[0] || null; }
  }
  for(let i=0;i<64;i++){
    const rr=Math.floor(i/8), ff=i%8; const r=flipped?7-rr:rr, f=flipped?7-ff:ff;
    const p=g[r][f]; const d=document.createElement("div");
    d.className="sq "+((r+f)%2?"d":"l"); d.dataset.sq=sq(f,7-r);
    if(from&&from[0]===r&&from[1]===f) d.classList.add("from");
    if(to&&to[0]===r&&to[1]===f){ d.classList.add("to"); if(cur){ const c=CLS[cur.classification]; d.insertAdjacentHTML("beforeend",`<span class="badge" style="background:var(${c.v})">${c.s}</span>`);} }
    if(p) d.insertAdjacentHTML("beforeend",`<span class="p ${p===p.toUpperCase()?"w":"b"}">${GLYPH[p.toUpperCase()]}</span>`);
    if(ff===0) d.insertAdjacentHTML("beforeend",`<span class="coord r">${8-r}</span>`);
    if(rr===7) d.insertAdjacentHTML("beforeend",`<span class="coord f">${"abcdefgh"[f]}</span>`);
    bd.appendChild(d);
  }
  // eval bar
  const cp = cur? cur.eval_after_cp : moves[0].eval_before_cp;
  const wp = 50+50*(2/(1+Math.exp(-0.00368208*Math.max(-1000,Math.min(1000,cp))))-1);
  $("evw").style.height=(flipped?100-wp:wp)+"%";
  const txt = Math.abs(cp)>=9000 ? "M" : (cp/100).toFixed(1);
  $("evtop").textContent = cp<0?txt:""; $("evbot").textContent = cp>=0?txt:"";
  // move list selection
  document.querySelectorAll(".mv").forEach(e=>e.classList.toggle("sel",+e.dataset.ply===ply));
  const s=document.querySelector(".mv.sel"); if(s) s.scrollIntoView({block:"nearest"});
  // comment
  const c=$("comment"); c.hidden=false;
  if(!cur){ c.innerHTML=`<b>${data.summary.white}</b> vs <b>${data.summary.black}</b> — ${data.summary.result}. Depth ${data.summary.depth}.`; return; }
  const who = cur.color==="white"?data.summary.white:data.summary.black;
  let t=`${ico(cur.classification)} <b>${cur.san}</b> is ${/^[AEIO]/.test(cur.classification)?"an":"a"} ${cur.classification.toLowerCase()}`;
  if(cur.classification==="Book") t=`${ico("Book")} <b>${cur.san}</b> is a book move. ${cur.note}`;
  else if(cur.classification==="Forced") t=`${ico("Forced")} <b>${cur.san}</b> was the only legal move`;
  else if(!["Best","Brilliant","Great"].includes(cur.classification)) t+=`. <b>${cur.best_san}</b> was best`;
  t+=`.<br><span style="color:var(--text-2)">Win chance ${cur.win_pct_best}% → ${cur.win_pct_played}% · move accuracy ${cur.accuracy}</span>`;
  c.innerHTML=t;
}

function load(d){
  data=d; const m=d.moves;
  for(let i=0;i<m.length;i++) m[i].fen_after = i+1<m.length ? m[i+1].fen : m[i].fen_after||m[i].fen;
  $("empty").hidden=true; $("review").hidden=false; $("moves").hidden=false;
  const s=d.summary;
  $("acc").innerHTML=`<div class="side w"><div class="name">${s.white}</div><div class="num">${s.accuracy.white}</div></div><div class="side b"><div class="name">${s.black}</div><div class="num">${s.accuracy.black}</div></div>`;
  $("counts").innerHTML=ORDER.filter(k=>(s.counts.white[k]||0)+(s.counts.black[k]||0)>0)
    .map(k=>`<div class="c">${s.counts.white[k]||0}</div><div class="lbl">${ico(k)}${k}</div><div class="c">${s.counts.black[k]||0}</div>`).join("");
  let html="";
  for(let i=0;i<m.length;i+=2){
    const w=m[i], b=m[i+1];
    html+=`<div class="mv-row"><div class="num">${w.move_number}.</div><div class="mv" data-ply="${i+1}">${ico(w.classification)}${w.san}</div>${b?`<div class="mv" data-ply="${i+2}">${ico(b.classification)}${b.san}</div>`:"<div></div>"}</div>`;
  }
  $("moves").innerHTML=html;
  $("moves").addEventListener("click",e=>{const t=e.target.closest(".mv"); if(t){ply=+t.dataset.ply;render();}});
  ply=0; render();
}
const go=n=>{ if(!data) return; ply=Math.max(0,Math.min(data.moves.length,n)); render(); };
$("first").onclick=()=>go(0); $("prev").onclick=()=>go(ply-1); $("next").onclick=()=>go(ply+1); $("last").onclick=()=>go(1e9);
$("flip").onclick=()=>{flipped=!flipped; if(data) render();};
document.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft")go(ply-1); if(e.key==="ArrowRight")go(ply+1); });
$("file").onchange=e=>{ const f=e.target.files[0]; if(f) f.text().then(t=>load(JSON.parse(t))); };
document.body.addEventListener("dragover",e=>e.preventDefault());
document.body.addEventListener("drop",e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) f.text().then(t=>load(JSON.parse(t))); });
fetch("out.json").then(r=>r.ok?r.json():null).then(d=>{ if(d) load(d); }).catch(()=>{});
</script>
</body>
</html>
